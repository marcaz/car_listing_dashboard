<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoplius Car Listing Dashboard</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="card monitors-panel">
        <div class="panel-head">
          <h1>Monitors</h1>
          <span id="monitors-count" class="count-pill">0</span>
        </div>
        <p class="muted">Track multiple search URLs at the same time.</p>

        <div id="monitor-list" class="monitor-list" aria-label="Configured monitors"></div>

        <section class="sub-card">
          <h2>Add monitor</h2>
          <form id="add-monitor-form">
            <label>
              Monitor name
              <input id="add-monitor-name" type="text" placeholder="BMW X3 M 2020-2022" />
            </label>
            <label>
              Search URL
              <input id="add-monitor-url" type="url" required placeholder="https://autoplius.lt/..." />
            </label>
            <div class="row">
              <label>
                Poll interval (s)
                <input id="add-poll-interval" type="number" min="15" value="60" />
              </label>
              <label>
                NEW window (min)
                <input id="add-new-badge" type="number" min="1" value="120" />
              </label>
            </div>
            <button id="add-monitor-btn" type="submit" class="btn">
              <span class="btn-label">Add monitor</span>
              <span class="btn-spinner" aria-hidden="true"></span>
            </button>
          </form>
        </section>
      </aside>

      <section class="main-column">
        <section class="card monitor-detail">
          <div class="panel-head">
            <h2 id="active-monitor-title">Active monitor</h2>
            <span id="active-monitor-url-chip" class="url-chip">-</span>
          </div>

          <div
            id="polling-indicator"
            class="polling-indicator idle"
            role="status"
            aria-live="polite"
          >
            <span class="poll-dot" aria-hidden="true"></span>
            <span id="polling-text">Idle</span>
          </div>

          <dl class="status-grid">
            <div>
              <dt>Last poll</dt>
              <dd id="status-last-poll">-</dd>
            </div>
            <div>
              <dt>Mode</dt>
              <dd id="status-source">-</dd>
            </div>
            <div>
              <dt>Result</dt>
              <dd id="status-message">-</dd>
            </div>
          </dl>

          <form id="active-monitor-form">
            <label>
              Monitor name
              <input id="active-monitor-name" type="text" required />
            </label>
            <label>
              Search URL
              <input id="active-monitor-url" type="url" required />
            </label>
            <div class="row">
              <label>
                Poll interval (seconds, min 15)
                <input id="active-poll-interval" type="number" min="15" />
              </label>
              <label>
                NEW badge window (minutes)
                <input id="active-new-badge" type="number" min="1" />
              </label>
            </div>

            <div class="row actions">
              <button id="save-monitor-btn" type="submit" class="btn">
                <span class="btn-label">Save monitor</span>
                <span class="btn-spinner" aria-hidden="true"></span>
              </button>
              <button id="poll-monitor-btn" type="button" class="btn secondary">
                <span class="btn-label">Poll now</span>
                <span class="btn-spinner" aria-hidden="true"></span>
              </button>
              <button id="delete-monitor-btn" type="button" class="btn danger">
                <span class="btn-label">Delete monitor</span>
                <span class="btn-spinner" aria-hidden="true"></span>
              </button>
            </div>
          </form>
        </section>

        <section class="card listings">
          <div class="listings-head">
            <h2>Listings</h2>
            <span id="listings-count" class="count-pill">0</span>
          </div>

          <div id="listing-segments" class="listing-segments" role="tablist" aria-label="Listing segments">
            <button class="segment-btn active" data-segment="all" role="tab" aria-selected="true">
              All
            </button>
            <button class="segment-btn" data-segment="new" role="tab" aria-selected="false">New</button>
            <button class="segment-btn" data-segment="updated" role="tab" aria-selected="false">
              Updated
            </button>
          </div>

          <div id="segment-summary" class="segment-summary muted"></div>
          <div id="listing-feed" class="listing-feed"></div>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
